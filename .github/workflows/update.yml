name: Update Liga 1 Data

on:
  schedule:
    # Runs at 11:00, 14:00, 16:00 UTC (18:00, 21:00, 23:00 WIB)
    - cron: '0 11,14,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Scraper
        run: |
          python scraper.py

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No changes in data.json"
          else
            git commit -m "Auto-update Liga 1 data [skip ci]"
            git push
          fi
