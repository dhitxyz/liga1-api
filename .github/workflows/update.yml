name: Update Liga 1 Data

on:
  schedule:
    # 07:15 WIB (08:15 WITA) - Persiapan Jadwal Pagi
    - cron: '15 0 * * *'
    # 12:15 WIB (13:15 WITA) - Cek Siang
    - cron: '15 5 * * *'
    # Jam Pertandingan (Sore s/d Malam): Tiap 30 menit dari 15:15 s/d 23:45 WIB (08:15 - 16:45 UTC)
    # Menghindari antrean menit :00 dan menjamin skor Full Time terupdate cepat
    - cron: '15,45 8-16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Scraper
        run: |
          python scraper.py

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No changes in data.json"
          else
            git commit -m "Auto-update Liga 1 data [skip ci]"
            git push
          fi
