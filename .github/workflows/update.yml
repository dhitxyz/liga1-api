name: Update Liga 1 Data

on:
  schedule:
    # 07:00 WIB (08:00 WITA) - Persiapan Jadwal Pagi
    - cron: '0 0 * * *'
    # 12:00 WIB (13:00 WITA) - Cek Siang
    - cron: '0 5 * * *'
    # 17:45 & 18:30 WIB (18:45 & 19:30 WITA) - Laga Sore Selesai (Full Time)
    - cron: '45 10 * * *'
    - cron: '30 11 * * *'
    # 21:15 & 22:00 WIB (22:15 & 23:00 WITA) - Laga Malam Selesai (Full Time)
    - cron: '15 14 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Scraper
        run: |
          python scraper.py

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No changes in data.json"
          else
            git commit -m "Auto-update Liga 1 data [skip ci]"
            git push
          fi
