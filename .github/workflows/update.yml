name: Update Liga 1 Data

on:
  schedule:
    # 07:15 WIB (08:15 WITA) - Persiapan Jadwal Pagi
    - cron: '15 0 * * *'
    # 12:15 WIB (13:15 WITA) - Cek Siang
    - cron: '15 5 * * *'
    # Jam Pertandingan: Tiap 30 menit (15:15 - 23:45 WIB)
    - cron: '15,45 8-16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Scraper
        run: |
          node liga1.js --once

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No changes in data.json"
          else
            git commit -m "Auto-update Liga 1 data [skip ci]"
            git push
          fi
